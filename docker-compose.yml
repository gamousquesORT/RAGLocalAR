version: "3.9"

services:
  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/.chroma/index
    environment:
      - IS_PERSISTENT=TRUE

  api:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text-v2-moe}
      - CHROMA_URL=http://chroma:8000
      - CHROMA_COLLECTION=${CHROMA_COLLECTION:-logistics_categories}
      - CSV_PATH=/app/data/logistics-categories.csv
      - TOP_K=${TOP_K:-5}
    depends_on:
      - chroma
    # Linux users: add the following to extra_hosts if host.docker.internal doesn't resolve:
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

volumes:
  chroma_data:
